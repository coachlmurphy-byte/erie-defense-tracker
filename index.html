.actions{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:6px;margin-top:7px}.logplay{background:var(--green);color:#fff;font-size:18px;min-height:55px}.repeat{background:var(--orange);color:#111827}.undo{background:#dbe1e6;color:#111827}.resultrow{display:block}.resultlabel{font-size:13px;font-weight:950;text-transform:uppercase;letter-spacing:.04em;margin:8px 0 5px}.yardentry{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:stretch}.yards input{min-height:50px;font-size:22px;text-align:center;padding:8px;border:2px solid #87939e;border-radius:8px;font-weight:950}.yardbuttons{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.yardbuttons button{min-width:54px;min-height:50px;padding:5px;background:#dce2e7;color:#111827;border:1px solid #b9c3cc;border-radius:8px;font-size:15px;font-weight:950}.clear{min-height:50px;padding:8px 12px;background:#dce2e7;color:#111827;border:1px solid #b9c3cc;white-space:nowrap}.yards{display:block}.resultgroup{margin-bottom:7px}.resultgroup:last-child{margin-bottom:0}.resultgroup-title{font-size:10px;font-weight:950;text-transform:uppercase;letter-spacing:.06em;color:#52606c;margin:0 0 4px}.resultgroup .results{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.results button{background:#dce2e7;color:#111827;border:1px solid #b9c3cc;min-height:43px}.results button.selected{background:var(--orange);border-color:var(--orange)}.yards{display:flex;gap:6px;align-items:stretch}.yardbox{display:grid;grid-template-columns:1fr 1fr;gap:4px;min-width:0;flex:1}.yards input{width:100%;min-width:0;padding:10px;border:1px solid #bac4ce;border-radius:8px;font-weight:850}.yardbuttons{display:grid;grid-template-columns:1fr 1fr;gap:4px}.yardbuttons button{padding:5px 4px;min-height:20px;background:#dce2e7;color:#111827;border:1px solid #b9c3cc;border-radius:6px;font-size:12px}.clear{background:#dce2e7;color:#111827;border:1px solid #b9c3cc;white-space:nowrap}
.last{padding:0;overflow:hidden;background:#101923;color:#fff;border-color:var(--orange)}.last .section-title{background:var(--orange);color:#111827;margin:0;padding:8px 10px}.lastcall{padding:8px;text-align:center;font-size:14px;font-weight:950;min-height:39px;line-height:1.25}.toolgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.toolgrid button{min-height:42px}.toolgrid .danger{color:#a31620}.log{max-height:calc(100vh - 370px);min-height:240px;overflow:auto;background:#fff;border-radius:7px}.row{display:grid;grid-template-columns:34px 40px 62px 42px minmax(0,1fr) 42px;gap:4px;padding:8px 4px;border-bottom:1px solid #e0e4e8;align-items:center;font-size:11px}.row .situationline{font-weight:800;color:#52606c;margin-bottom:2px}.row .callline{font-weight:900}.row .result{font-weight:950;font-size:12px}.row .resultline{margin-top:2px}.row b{font-size:13px}.row .call{line-height:1.2}.row .result{font-weight:950}.del{padding:7px 4px;background:#fee1e3;color:#a31620}
.modal.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px;z-index:1000}.modalbox{background:#f4f6f8;color:#111827;border-radius:11px;border:1px solid #b8c1ca;width:min(900px,100%);max-height:92vh;overflow:auto;padding:12px}.modalhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.modalhead h2{margin:0;font-size:20px}.close{background:#dce2e7}.family{margin-bottom:9px}.family h3{margin:0 0 5px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#3e4a55}.optiongrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.optiongrid button{min-height:48px;background:#dce2e7;color:#111827;border:1px solid #b9c3cc}.optiongrid button.selected{background:var(--orange);border-color:var(--orange)}.optiongrid button.none{font-style:italic}.modalfooter{margin-top:9px;display:flex;justify-content:flex-end}.modalfooter button{background:var(--dark);color:#fff}.note{margin-top:7px}.note input{width:100%;padding:10px;border:1px solid #bac4ce;border-radius:8px}.penalty{margin-top:7px;padding:9px;border:1px solid #39434c;border-radius:8px;background:#151e25;color:#fff}.penaltygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.penaltygrid button{background:#202b34;color:#fff;border:2px solid #56616b;min-height:43px}.penaltygrid button.active{border-color:var(--orange);background:#3a2518}.reportgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.metric{background:#182330;color:#fff;border:1px solid #65727d;border-radius:8px;padding:9px;text-align:center}.metric b{display:block;color:var(--orange);font-size:10px;text-transform:uppercase}.metric strong{display:block;font-size:22px;margin-top:2px}.reportsection{margin-top:10px}.reportsection h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 5px}.reporttable{width:100%;border-collapse:collapse;font-size:11px}.reporttable th,.reporttable td{padding:5px;border-bottom:1px solid #d8dde2;text-align:left}.reporttable th{background:#e6eaee;font-weight:950}.reporttable td.num,.reporttable th.num{text-align:right}.reporttabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.reporttabs button{background:#dce2e7;color:#111827}.reporttabs button.active{background:var(--orange)}.analysis-key{padding:9px;background:#e8edf1;border-left:4px solid var(--orange);border-radius:6px;font-size:11px;margin-bottom:9px}.reportsection h4{font-size:10px;letter-spacing:.05em;margin:7px 0 4px;color:#4a5660}
@media(max-width:900px){.main{grid-template-columns:1fr}.log{max-height:360px}.setup{grid-template-columns:1fr 1fr}.callgrid{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.app{padding:6px}.setup{grid-template-columns:1fr}.situation{grid-template-columns:repeat(4,1fr)}.sit strong{font-size:21px}.callgrid{grid-template-columns:1fr}.resultgroup .results{grid-template-columns:repeat(2,1fr)}.resultrow{grid-template-columns:1fr}.reportgrid{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr}.optiongrid{grid-template-columns:repeat(2,1fr)}}

<body><div class="app">
<header><div><h1>Erie Defensive Tracker</h1><div class="small">Game-ready • 11-inch iPad landscape • no game clock</div></div><div id="saveStatus" class="status saved">SAVED</div></header>
<div class="setup"><input id="opponent" placeholder="Opponent"><input id="gameDate" type="date"><input id="location" placeholder="Location"><button class="primary" onclick="newGame()">NEW GAME</button></div>
<div class="situation"><div class="sit"><b>QUARTER</b><strong id="q">1</strong></div><div class="sit"><b>DOWN</b><strong id="down">1</strong></div><div class="sit"><b>DISTANCE</b><strong id="distance">10</strong></div><div class="sit"><b>HASH</b><strong id="hash">M</strong></div></div>
<div class="main"><section>
<div class="card"><div class="section-title">Ball Position / Hash</div><div class="hashgrid" id="hashes"><button data-v="LEFT">LEFT HASH</button><button data-v="MIDDLE" class="selected">MIDDLE</button><button data-v="RIGHT">RIGHT HASH</button></div></div>
<div class="card callcard"><div class="section-title">Defensive Call</div><div class="callgrid" id="callGrid"></div><div class="callsummary" id="callSummary"><span class="label">CURRENT CALL</span><span class="callvalue">—</span></div><div class="note"><input id="maul" placeholder="Optional Maul / Note"></div></div>
<div class="card"><div class="section-title">Play Result</div><div class="results" id="outcomes"></div><div class="resultlabel">Yards Gained / Lost</div><div class="yardentry"><div class="yards"><input id="yards" type="number" step="1" inputmode="numeric" placeholder="0" aria-label="Yards gained or lost"></div><div class="yardbuttons"><button type="button" data-yard="-1">−1</button><button type="button" data-yard="+1">+1</button><button type="button" data-yard="-5">−5</button><button type="button" data-yard="+5">+5</button></div><button class="clear" onclick="clearResult()">CLEAR</button></div><div id="penaltyOptions" class="penalty hidden"><b>PENALTY HANDLING</b><div class="penaltygrid"><button data-mode="same" class="active">NO DOWN CHANGE</button><button data-mode="count">DOWN COUNTS</button><button data-mode="declined">DECLINED</button></div><div class="small" style="margin-top:5px">Enter net penalty yards.</div></div><div class="actions"><button class="logplay" onclick="logPlay()">LOG PLAY</button><button class="repeat" onclick="repeatLast()">REPEAT LAST CALL</button><button class="undo" onclick="undoLast()">UNDO LAST PLAY</button></div></div>
</section><aside>
<div class="last"><div class="section-title">Last Call</div><div class="lastcall" id="lastCall">—</div></div>
<div class="card"><div class="section-title">Game Controls</div><div class="toolgrid"><button onclick="nextQuarter()">NEXT QUARTER</button><button onclick="manageCalls()">MANAGE CALLS</button><button onclick="backup()">BACKUP GAME</button><button onclick="document.getElementById('restoreFile').click()">RESTORE</button><button onclick="exportCSV()">EXPORT CSV</button><button onclick="showReport('summary')">GAME SUMMARY</button><button onclick="showReport('analysis')">CALL ANALYSIS</button><button class="danger" onclick="clearGame()">CLEAR GAME</button></div><input id="restoreFile" hidden type="file" accept=".json" onchange="restore(event)"></div>
<div class="card"><div class="section-title">Recent Plays</div><div id="log" class="log"></div></div>
</aside></div></div>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalBox"></div></div>
<script>
const DB_NAME="erie_def_tracker_v03_db",STORE="game",KEY="active",FALLBACK="erie_def_tracker_v03";
const CALL_LIBRARY_VERSION=2;
const DEFAULT_CALLS={fronts:{"40 Defense":["Tiger","Slide","Top","Heads","Tip","Wide","Over","Under","Boss","Mug","Mug Wide"],"30 Defense":["Tite","Okie","Stack","Bunch","Bunch Up","Okie Mug"],"Goaline":["Goaline"]},stunts:{"Slant":["Slant Base","Slant Slide","Slant Wide","Slant Tip"],"Angle":["Angle Out","Angle In","Angle Field","Angle Bench"],"Other / Special":["Heavy","Ambush","Raider","Torch","Pirate","Texas Twist","Eat Twist","Exit Twist"]},blitzes:{"Gap":["Gap Falcons","Gap Bucs","Gap Ravens","Gap Oilers","Gap Steelers","Gap Washington"],"Plug":["Plug Ravens","Plug Oilers"],"Clog":["Clog Ravens"],"Edge":["Edge Washington"],"Fire":["Fire Falcons","Fire Washington"],"Ice":["Ice Ravens","Ice Bucs"],"Other":["Mizzou","Michigan"]},coverages:{"Coverage":["Lime","Green","White","Grey","Red","Orange","Black","Brown","Ironman","Eagle"]},coveragechecks:{"Checks":["Jordan","Cut"]}};
const flat=(obj)=>Object.values(obj).flat();
let state={version:13,callLibraryVersion:CALL_LIBRARY_VERSION,q:1,down:1,distance:10,hash:"MIDDLE",plays:[],settings:{opponent:"",date:"",location:""},calls:clone(DEFAULT_CALLS),current:{front:"Tiger",stunt:"None",blitz:"None",coverage:"None",coveragecheck:"None",maul:"",yards:"",outcome:"NORMAL"},lastCall:{front:"Tiger",stunt:"None",blitz:"None",coverage:"None",coveragecheck:"None",maul:""},penaltyMode:"same"};
let db=null,saveTimer=null;
function clone(x){return JSON.parse(JSON.stringify(x))} function setStatus(t,c="saved"){const e=document.getElementById("saveStatus");e.textContent=t;e.className="status "+c} function situation(){return {q:state.q,down:state.down,distance:state.distance,hash:state.hash}}
function mark(){setStatus("SAVING…","dirty");clearTimeout(saveTimer);saveTimer=setTimeout(saveAll,150)}
function saveAll(){const snap=clone(state);try{localStorage.setItem(FALLBACK,JSON.stringify(snap))}catch(e){}if(db){const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put({id:KEY,state:snap});tx.oncomplete=()=>setStatus("SAVED");tx.onerror=()=>setStatus("SAVED LOCALLY")}else setStatus("SAVED LOCALLY")}
function openDB(){return new Promise(r=>{if(!indexedDB)return r();const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:"id"});req.onsuccess=()=>{db=req.result;r()};req.onerror=()=>r()})}
function normalize(s){s.version=13;s.plays=s.plays||[];s.settings=s.settings||{};if(s.callLibraryVersion!==CALL_LIBRARY_VERSION){s.calls=clone(DEFAULT_CALLS);s.callLibraryVersion=CALL_LIBRARY_VERSION;}else{s.calls=s.calls||clone(DEFAULT_CALLS);}if(Array.isArray(s.calls.fronts)){s.calls={fronts:{"40 Defense":s.calls.fronts},stunts:{"Calls":s.calls.stunts||["None"]},blitzes:{"Calls":s.calls.blitzes||["None"]},coverages:{"Calls":s.calls.coverages||["None"]},coveragechecks:{"Checks":s.calls.coveragechecks||["None"]}}}Object.keys(DEFAULT_CALLS).forEach(k=>{s.calls[k]=s.calls[k]||clone(DEFAULT_CALLS[k])});s.current=s.current||clone(state.current);s.lastCall=s.lastCall||clone(state.lastCall);if(s.current.blitz==null&&s.current.action!=null)s.current.blitz=s.current.action;delete s.current.action;if(s.lastCall.blitz==null&&s.lastCall.action!=null)s.lastCall.blitz=s.lastCall.action;delete s.lastCall.action;[s.current,s.lastCall].forEach(c=>{c.front=c.front||"Tiger";c.stunt=c.stunt||"None";c.blitz=c.blitz||"None";c.coverage=c.coverage||"None";c.coveragecheck=c.coveragecheck||"None";c.maul=c.maul||""});s.q=Number(s.q)||1;s.down=Number(s.down)||1;s.distance=Number(s.distance)||10;s.hash=s.hash||"MIDDLE";s.penaltyMode=s.penaltyMode||"same";return s}
async function init(){await openDB();let loaded=null;if(db)loaded=await new Promise(r=>{const rq=db.transaction(STORE,"readonly").objectStore(STORE).get(KEY);rq.onsuccess=()=>r(rq.result?.state||null);rq.onerror=()=>r(null)});if(!loaded){try{loaded=JSON.parse(localStorage.getItem(FALLBACK)||"null")}catch(e){}}if(loaded)state=normalize(loaded);document.getElementById("gameDate").value=state.settings.date||new Date().toISOString().slice(0,10);document.getElementById("opponent").value=state.settings.opponent||"";document.getElementById("location").value=state.settings.location||"";renderAll()}
const CATS=[{key:"front",label:"FRONT",title:"Front",groups:()=>state.calls.fronts,required:true},{key:"stunt",label:"STUNT",title:"Stunt",groups:()=>state.calls.stunts},{key:"blitz",label:"BLITZ",title:"Blitz",groups:()=>state.calls.blitzes},{key:"coverage",label:"COVERAGE",title:"Coverage",groups:()=>state.calls.coverages,required:true},{key:"coveragecheck",label:"CHECK",title:"Coverage Check",groups:()=>state.calls.coveragechecks}];
function selectedText(key){return state.current[key]||"None"}
function renderCallGrid(){const el=document.getElementById("callGrid");el.innerHTML=CATS.map(c=>`<div class="callrow"><div class="label">${c.label}</div><button type="button" class="pick ${selectedText(c.key)!=="None"?"active":""}" data-open-picker="${c.key}"><span class="value">${selectedText(c.key)}</span><span class="hint">TAP TO CHANGE</span></button></div>`).join("")}
function renderAll(){document.getElementById("q").textContent=state.q;document.getElementById("down").textContent=state.down;document.getElementById("distance").textContent=state.distance;document.getElementById("hash").textContent=state.hash==="MIDDLE"?"M":state.hash[0];document.querySelectorAll("#hashes button").forEach(b=>b.classList.toggle("selected",b.dataset.v===state.hash));renderCallGrid();document.getElementById("maul").value=state.current.maul||"";document.querySelector("#callSummary .callvalue").textContent=callText(state.current)||"—";document.getElementById("lastCall").textContent=callText(state.lastCall)||"—";renderOutcomes();renderLog();syncPenaltyUI()}
function callText(c){return [c.front,c.stunt,c.blitz,c.coverage,c.coveragecheck].filter(x=>x&&x!=="None").join(" • ")+(c.maul?" • MAUL: "+c.maul:"")}
function openPicker(key){const cat=CATS.find(x=>x.key===key);if(!cat)return;const groups=cat.groups();let html=`<div class="modalhead"><h2>${cat.title}</h2><button type="button" class="close" data-close-modal>CLOSE</button></div>`;if(!cat.required)html+=`<div class="family"><h3>Optional</h3><div class="optiongrid"><button type="button" class="none ${selectedText(key)==="None"?"selected":""}" data-choose-key="${key}" data-choose-value="None" onclick="chooseCall('${key}','None')">None</button></div></div>`;Object.entries(groups).forEach(([g,vals])=>{html+=`<div class="family"><h3>${g}</h3><div class="optiongrid">${vals.map(v=>`<button type="button" class="${state.current[key]===v?"selected":""}" data-choose-key="${key}" data-choose-value="${encodeURIComponent(v)}" onclick="chooseCall('${key}',decodeURIComponent('${encodeURIComponent(v)}'))">${v}</button>`).join("")}</div></div>`});document.getElementById("modalBox").innerHTML=html;document.getElementById("modal").classList.remove("hidden")}
function chooseCall(key,v){state.current[key]=v;closeModal();renderAll();mark()}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function renderOutcomes(){const groups={"STANDARD":["NORMAL","INC"],"NEGATIVE PLAY":["SACK","TFL"],"TURNOVER":["INT","FUM"],"POSSESSION ENDING":["PUNT","TD","FG"],"PENALTY":["PENALTY"]};const el=document.getElementById("outcomes");el.innerHTML=Object.entries(groups).map(([g,vals])=>`<div class="resultgroup"><div class="resultgroup-title">${g}</div><div class="results">${vals.map(v=>`<button type="button" class="${state.current.outcome===v?"selected":""}" onclick="setOutcome('${v}')">${v}</button>`).join("")}</div></div>`).join("");document.getElementById("yards").value=state.current.yards}
function setOutcome(v){state.current.outcome=v;renderOutcomes();syncPenaltyUI();mark()}
function clearResult(){state.current.yards="";state.current.outcome="NORMAL";renderOutcomes();syncPenaltyUI();mark()}
function syncPenaltyUI(){document.getElementById("penaltyOptions").classList.toggle("hidden",state.current.outcome!=="PENALTY");document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===state.penaltyMode))}
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{state.penaltyMode=b.dataset.mode;syncPenaltyUI();mark()});
function advance(y,outcome){const yards=Number(y)||0;if(outcome==="INT"||outcome==="FUM"||outcome==="PUNT"||outcome==="TD"||outcome==="FG"){state.down=1;state.distance=10;return}if(outcome==="PENALTY"&&state.penaltyMode==="same"){state.distance=Math.max(1,state.distance-yards);return}if(yards>=state.distance){state.down=1;state.distance=10}else if(state.down>=4){state.down=1;state.distance=10}else{state.down++;state.distance=Math.max(1,state.distance-yards)}}
function logPlay(){const call=clone(state.current),y=Number(call.yards||0),before=situation();if(!call.front||!call.coverage){alert("Select a Front and Coverage before logging the play.");return}state.plays.push({n:state.plays.length+1,q:state.q,down:state.down,distance:state.distance,hash:state.hash,call,yards:y,outcome:call.outcome,penaltyMode:state.penaltyMode,before});state.lastCall={front:call.front,stunt:call.stunt,blitz:call.blitz,coverage:call.coverage,coveragecheck:call.coveragecheck,maul:call.maul};advance(y,call.outcome);state.current={front:call.front,stunt:"None",blitz:"None",coverage:call.coverage,coveragecheck:"None",maul:"",yards:"",outcome:"NORMAL"};saveAll();renderAll()}
function repeatLast(){state.current=clone(state.lastCall);state.current.yards="";state.current.outcome="NORMAL";renderAll();mark()}
function undoLast(){if(!state.plays.length)return;const p=state.plays.pop();state.q=p.before.q;state.down=p.before.down;state.distance=p.before.distance;state.hash=p.before.hash;state.current=clone(p.call);state.current.yards="";state.current.outcome="NORMAL";state.lastCall=state.plays.length?clone(state.plays[state.plays.length-1].call):clone({front:"Tiger",stunt:"None",blitz:"None",coverage:"None",coveragecheck:"None",maul:""});saveAll();renderAll()}
function nextQuarter(){if(state.q>=4){alert("Already in the 4th quarter.");return}if(!confirm("Move to the next quarter?"))return;state.q++;state.down=1;state.distance=10;state.hash="MIDDLE";saveAll();renderAll()}
function newGame(){if(state.plays.length&&!confirm("Start a new game? Back up the current game first if needed."))return;const settings={opponent:document.getElementById("opponent").value,date:document.getElementById("gameDate").value,location:document.getElementById("location").value};state={version:13,callLibraryVersion:CALL_LIBRARY_VERSION,q:1,down:1,distance:10,hash:"MIDDLE",plays:[],settings,calls:state.calls,current:{front:"Tiger",stunt:"None",blitz:"None",coverage:"None",coveragecheck:"None",maul:"",yards:"",outcome:"NORMAL"},lastCall:{front:"Tiger",stunt:"None",blitz:"None",coverage:"None",coveragecheck:"None",maul:""},penaltyMode:"same"};saveAll();renderAll()}
function clearGame(){if(!confirm("CLEAR GAME? This removes the current play log. Use BACKUP GAME first if needed."))return;state.plays=[];state.q=1;state.down=1;state.distance=10;state.hash="MIDDLE";saveAll();renderAll()}
function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="erie_defensive_game_backup.json";a.click();URL.revokeObjectURL(a.href)}
function restore(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=normalize(JSON.parse(r.result));if(!confirm("Restore this game backup and replace the current game?"))return;state=x;saveAll();renderAll()}catch(e){alert("That backup file could not be restored.")}};r.readAsText(f);ev.target.value=""}
function csvEscape(v){return '"'+String(v??"").replaceAll('"','""')+'"'}function exportCSV(){const date=state.settings.date||document.getElementById("gameDate").value||"";const opponent=state.settings.opponent||document.getElementById("opponent").value||"";const location=state.settings.location||document.getElementById("location").value||"";const rows=[["Game Date","Opponent","Location","Play","Q","Down","Distance","Hash","Front","Stunt","Blitz","Coverage","Coverage Check","Maul","Yards","Outcome"]];state.plays.forEach(p=>rows.push([date,opponent,location,p.n,p.q,p.down,p.distance,p.hash,p.call.front,p.call.stunt,p.call.blitz,p.call.coverage,p.call.coveragecheck,p.call.maul,p.yards,p.outcome]));const safeOpponent=(opponent||"game").replace(/[^a-z0-9_-]+/gi,"_");const safeDate=(date||"undated").replace(/[^0-9-]+/g,"-");const blob=new Blob([rows.map(r=>r.map(csvEscape).join(",")).join("\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`erie_${safeOpponent}_${safeDate}_defensive_plays.csv`;a.click();URL.revokeObjectURL(a.href)}
function renderLog(){const el=document.getElementById("log");if(!state.plays.length){el.innerHTML='<div class="small" style="padding:10px;color:#66717d">No plays logged yet.</div>';return}el.innerHTML=state.plays.slice().reverse().map(p=>`<div class="row"><b>#${p.n}</b><span>Q${p.q}</span><span>${p.down}&${p.distance}</span><span>${p.hash[0]}</span><div class="call"><div class="situationline">${p.down}&${p.distance} • ${p.hash} HASH</div><div class="callline">${callText(p.call)||"—"}</div><div class="resultline"><span class="result">${p.outcome} ${p.yards>0?"+":""}${p.yards}</span></div></div><button class="del" onclick="deletePlay(${p.n})">DEL</button></div>`).join("")}
function deletePlay(n){if(!confirm("Delete play "+n+"? This cannot be undone."))return;const i=state.plays.findIndex(p=>p.n===n);if(i<0)return;state.plays.splice(i,1);state.plays.forEach((p,j)=>p.n=j+1);rebuildStateFromPlays();saveAll();renderAll()}
function rebuildStateFromPlays(){if(!state.plays.length){state.q=1;state.down=1;state.distance=10;state.hash="MIDDLE";return}let s={q:state.plays[0].before.q,down:state.plays[0].before.down,distance:state.plays[0].before.distance,hash:state.plays[0].before.hash};for(const p of state.plays){s.q=p.before.q;s.down=p.before.down;s.distance=p.before.distance;s.hash=p.before.hash;const saved={q:state.q,down:state.down,distance:state.distance,hash:state.hash};state.q=s.q;state.down=s.down;state.distance=s.distance;state.hash=s.hash;advance(p.yards,p.outcome);s={q:state.q,down:state.down,distance:state.distance,hash:state.hash};state.q=saved.q;state.down=saved.down;state.distance=saved.distance;state.hash=saved.hash}state.q=s.q;state.down=s.down;state.distance=s.distance;state.hash=s.hash}
function reportMetrics(){const plays=state.plays;const totalYards=plays.reduce((a,p)=>a+Number(p.yards||0),0);const firstDowns=plays.filter(p=>{if(["INT","FUM","PUNT","TD","FG","PENALTY"].includes(p.outcome))return false;return Number(p.yards||0)>=Number(p.distance||10)}).length;const sacks=plays.filter(p=>p.outcome==="SACK").length,tfl=plays.filter(p=>p.outcome==="TFL").length,ints=plays.filter(p=>p.outcome==="INT").length,fums=plays.filter(p=>p.outcome==="FUM").length,punts=plays.filter(p=>p.outcome==="PUNT").length,tds=plays.filter(p=>p.outcome==="TD").length,fgs=plays.filter(p=>p.outcome==="FG").length,pen=plays.filter(p=>p.outcome==="PENALTY").length;const positive=plays.filter(p=>Number(p.yards||0)<=0).length;return {plays,totalYards,avg:plays.length?(totalYards/plays.length):0,firstDowns,sacks,tfl,ints,fums,punts,tds,fgs,pen,positive}}
function callAnalysisRows(key){const m=new Map();for(const p of state.plays){const v=p.call?.[key]||"None";if(!m.has(v))m.set(v,{call:v,calls:0,yards:0,first:0,negative:0,sack:0,tfl:0,to:0,td:0,fg:0,stops:0});const x=m.get(v),y=Number(p.yards||0),d=Number(p.distance||10);x.calls++;x.yards+=y;if(p.outcome==="TFL")x.tfl++;if(p.outcome==="SACK")x.sack++;if(p.outcome==="INT"||p.outcome==="FUM")x.to++;if(p.outcome==="TD")x.td++;if(p.outcome==="FG")x.fg++;if(y<=0)x.negative++;const isFirst=!['INT','FUM','PUNT','TD','FG','PENALTY'].includes(p.outcome)&&y>=d;if(isFirst)x.first++;if(!isFirst&&!['PENALTY'].includes(p.outcome))x.stops++}return [...m.values()].sort((a,b)=>b.calls-a.calls)}
function analysisStats(rows){return rows.map(x=>({...x,avg:x.calls?x.yards/x.calls:0,negativePct:x.calls?100*x.negative/x.calls:0,stopPct:x.calls?100*x.stops/x.calls:0,toPct:x.calls?100*x.to/x.calls:0}))}
function bestWorst(rows){const eligible=analysisStats(rows).filter(x=>x.calls>=2);if(!eligible.length)return {best:[],worst:[]};const best=[...eligible].sort((a,b)=>a.avg-b.avg).slice(0,3),worst=[...eligible].sort((a,b)=>b.avg-a.avg).slice(0,3);return {best,worst}}
function reportTable(rows){rows=analysisStats(rows);if(!rows.length)return '<div class="small" style="color:#66717d">No plays to analyze yet.</div>';return `<div class="tablewrap"><table class="reporttable"><thead><tr><th>Call</th><th class="num">Calls</th><th class="num">Avg</th><th class="num">1D</th><th class="num">Stop%</th><th class="num">Neg%</th><th class="num">SACK</th><th class="num">TFL</th><th class="num">TO</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.call}</td><td class="num">${x.calls}</td><td class="num">${x.avg.toFixed(1)}</td><td class="num">${x.first}</td><td class="num">${x.stopPct.toFixed(0)}%</td><td class="num">${x.negativePct.toFixed(0)}%</td><td class="num">${x.sack}</td><td class="num">${x.tfl}</td><td class="num">${x.to}</td></tr>`).join("")}</tbody></table></div>`}
function rankedTable(rows,title){if(!rows.length)return `<div class="small" style="color:#66717d">Not enough repeated calls yet. Rankings require at least 2 calls.</div>`;return `<div class="reportsection"><h4>${title}</h4><div class="tablewrap"><table class="reporttable"><thead><tr><th>Call</th><th class="num">Calls</th><th class="num">Avg</th><th class="num">Stop%</th><th class="num">Neg%</th><th class="num">TO</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.call}</td><td class="num">${x.calls}</td><td class="num">${x.avg.toFixed(1)}</td><td class="num">${x.stopPct.toFixed(0)}%</td><td class="num">${x.negativePct.toFixed(0)}%</td><td class="num">${x.to}</td></tr>`).join("")}</tbody></table></div></div>`}
function showReport(type){const m=reportMetrics();let html=`<div class="modalhead"><h2>${type==="summary"?"Game Summary":"Defensive Call Analysis"}</h2><button type="button" class="close" data-close-modal>CLOSE</button></div><div class="small" style="color:#66717d;margin-bottom:8px">${state.settings.opponent||"Opponent not entered"} • ${state.settings.date||"Date not entered"}</div>`;if(type==="summary"){html+=`<div class="reportgrid">${[["PLAYS",m.plays.length],["YARDS ALLOWED",m.totalYards],["AVG / PLAY",m.avg.toFixed(1)],["1ST DOWNS",m.firstDowns],["SACKS",m.sacks],["TFL",m.tfl],["INT",m.ints],["FUM",m.fums],["PUNTS",m.punts],["TD ALLOWED",m.tds],["FG ALLOWED",m.fgs],["PENALTIES",m.pen]].map(x=>`<div class="metric"><b>${x[0]}</b><strong>${x[1]}</strong></div>`).join("")}</div><div class="reportsection"><h3>Down Analysis</h3><div class="tablewrap"><table class="reporttable"><thead><tr><th>Down</th><th class="num">Plays</th><th class="num">Yards</th><th class="num">Avg</th><th class="num">1D</th><th class="num">Negative</th></tr></thead><tbody>${downAnalysisRows().map(x=>`<tr><td>${x.down}</td><td class="num">${x.calls}</td><td class="num">${x.yards>0?"+":""}${x.yards}</td><td class="num">${(x.yards/x.calls).toFixed(1)}</td><td class="num">${x.first}</td><td class="num">${x.negative}</td></tr>`).join("")||'<tr><td colspan="6">No plays logged.</td></tr>'}</tbody></table></div></div><div class="reportsection"><h3>Distance Situation</h3><div class="tablewrap"><table class="reporttable"><thead><tr><th>Situation</th><th class="num">Plays</th><th class="num">Yards</th><th class="num">Avg</th><th class="num">1D</th></tr></thead><tbody>${distanceAnalysisRows().map(x=>`<tr><td>${x.label}</td><td class="num">${x.calls}</td><td class="num">${x.yards>0?"+":""}${x.yards}</td><td class="num">${x.avg.toFixed(1)}</td><td class="num">${x.first}</td></tr>`).join("")||'<tr><td colspan="5">No plays logged.</td></tr>'}</tbody></table></div></div>`}else{const cats=[['Front','front'],['Stunt','stunt'],['Blitz','blitz'],['Coverage','coverage'],['Coverage Check','coveragecheck']];html+=`<div class="analysis-key"><b>How to read it:</b> Avg = yards allowed per call. Stop% = plays that did not gain a first down. Neg% = 0 or fewer yards. TO = INT + FUM. Rankings use calls made at least twice.</div>`;cats.forEach(([title,key])=>{const rows=callAnalysisRows(key),bw=bestWorst(rows);html+=`<div class="reportsection"><h3>${title}</h3>${reportTable(rows)}${rankedTable(bw.best,'BEST — LOWEST AVG YARDS')}${rankedTable(bw.worst,'WATCH — HIGHEST AVG YARDS')}</div>`})}html+='<div class="modalfooter"><button onclick="closeModal()">DONE</button></div>';document.getElementById("modalBox").innerHTML=html;document.getElementById("modal").classList.remove("hidden")}
function manageCalls(){let html='<div class="modalhead"><h2>Manage Calls</h2><button class="close" onclick="closeModal()">CLOSE</button></div><div class="small" style="color:#66717d;margin-bottom:8px">The built-in call library is now organized by family. Additions are saved on this device.</div>';Object.entries(state.calls).forEach(([key,groups])=>{html+=`<div class="family"><h3>${key.toUpperCase()}</h3>`;Object.entries(groups).forEach(([g,vals])=>{html+=`<div style="font-weight:800;font-size:11px;margin:5px 0">${g}</div>`;vals.forEach((v,i)=>{html+=`<div style="display:flex;gap:5px;margin:3px 0"><span style="flex:1;padding:7px;background:#e9edf1;border-radius:6px">${v}</span><button class="del" onclick="deleteManaged('${key}','${g}',${i})">X</button></div>`})});html+=`<div style="display:flex;gap:5px;margin-top:5px"><input id="add-${key}" placeholder="Add call"><button class="primary" onclick="addManaged('${key}')">ADD</button></div></div>`});html+='<div class="modalfooter"><button onclick="closeModal()">DONE</button></div>';document.getElementById("modalBox").innerHTML=html;document.getElementById("modal").classList.remove("hidden")}
function addManaged(key){const inp=document.getElementById("add-"+key),v=inp.value.trim();if(!v)return;const first=Object.keys(state.calls[key])[0];if(flat(state.calls[key]).includes(v))return alert("That call already exists.");state.calls[key][first].push(v);saveAll();manageCalls();renderAll()}
function deleteManaged(key,g,i){if(!confirm("Delete this call?"))return;state.calls[key][g].splice(i,1);saveAll();manageCalls();renderAll()}
document.getElementById("callGrid").addEventListener("click",e=>{const b=e.target.closest("[data-open-picker]");if(b)openPicker(b.dataset.openPicker)});document.getElementById("modalBox").addEventListener("click",e=>{const b=e.target.closest("[data-choose-key]");if(b){chooseCall(b.dataset.chooseKey,decodeURIComponent(b.dataset.chooseValue));return}if(e.target.closest("[data-close-modal]"))closeModal()});document.getElementById("yards").addEventListener("input",e=>{state.current.yards=e.target.value;mark()});document.querySelectorAll(".yardbuttons button").forEach(b=>b.addEventListener("click",()=>{const cur=Number(state.current.yards||0);state.current.yards=String(cur+Number(b.dataset.yard));renderOutcomes();mark()}));document.getElementById("yards").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur()});document.querySelectorAll("#hashes button").forEach(b=>b.onclick=()=>{state.hash=b.dataset.v;renderAll();mark()});["opponent","gameDate","location"].forEach(id=>document.getElementById(id).addEventListener("change",()=>{state.settings.opponent=document.getElementById("opponent").value;state.settings.date=document.getElementById("gameDate").value;state.settings.location=document.getElementById("location").value;mark()}));document.getElementById("maul").addEventListener("input",e=>{state.current.maul=e.target.value;mark()});document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")saveAll()});window.addEventListener("beforeunload",saveAll);init();
</script></body></html>
